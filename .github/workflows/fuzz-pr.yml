# Thin caller for target repos (personal-account / central-dispatch mode).
# Copied by cf_enable_repo.sh → .github/workflows/fuzz-pr.yml
#
# Requires repo secret CLUSTERFUZZ_DISPATCH_TOKEN (PAT with repo + workflow
# on WiredMind2/clusterfuzz) — set automatically by cf_enable_repo.sh.

name: ClusterFuzz PR fuzz

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to WiredMind2/clusterfuzz
        env:
          GH_TOKEN: ${{ secrets.CLUSTERFUZZ_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "error: CLUSTERFUZZ_DISPATCH_TOKEN secret missing — re-run cf_enable_repo.sh" >&2
            exit 1
          fi
          gh api --method POST \
            repos/WiredMind2/clusterfuzz/dispatches \
            -f event_type='clusterfuzz-pr-fuzz' \
            -f "client_payload[repository]=${{ github.repository }}" \
            -f "client_payload[pr_number]=${{ github.event.pull_request.number }}" \
            -f "client_payload[sha]=${{ github.event.pull_request.head.sha }}" \
            -f "client_payload[fuzz_engine]=${{ vars.FUZZ_ENGINE || 'auto' }}" \
            -f "client_payload[target_id]=${{ vars.TARGET_ID || github.event.repository.name }}"
          echo "==> Dispatched clusterfuzz-pr-fuzz for ${{ github.repository }}#${{ github.event.pull_request.number }}"
